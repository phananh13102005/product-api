name: Product API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: npm ci

      - name: Start MongoDB for Jest tests
        run: docker compose up -d mongodb

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "starting")

            echo "MongoDB: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs mongodb
          exit 1

      - name: Run Jest tests
        run: npm test

      - name: Build and start containers
        run: docker compose up -d --build