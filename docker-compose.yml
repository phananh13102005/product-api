services:

  mongodb:
    image: mongo:latest
    container_name: nammongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  product-api:
    build: .
    container_name: product-api

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mongo-data: